name: Scheduled Ingestion & Warehouse Pipeline

on:
  schedule:
    # Run every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source identifier to ingest'
        required: true
        default: 'open_charge_map'
      limit:
        description: 'Maximum records to fetch'
        required: true
        default: '50'
      scope:
        description: 'Geographic scope'
        required: true
        default: 'mumbai'
      dry_run:
        description: 'Dry run (no database writes)'
        required: true
        type: boolean
        default: false

jobs:
  pipeline:
    name: Run Ingestion, Warehouse ETL & Quality Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestion Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          SOURCE="${{ github.event.inputs.source || 'open_charge_map' }}"
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          SCOPE="${{ github.event.inputs.scope || 'mumbai' }}"
          python -m backend.ingestion.runner --source "$SOURCE" --limit "$LIMIT" --scope "$SCOPE" --run-once $EXTRA_ARGS

      - name: Execute Warehouse ETL
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ETL_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ETL_ARGS="--dry-run"
          fi
          python -m backend.warehouse.etl --job all $ETL_ARGS

      - name: Execute Warehouse Data Quality Checks
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m backend.warehouse.quality

      - name: Measure Warehouse Data Maturity
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m backend.warehouse.maturity
