name: Scheduled Ingestion & Warehouse Pipeline

on:
  schedule:
    # Run every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source identifier to ingest'
        required: true
        default: 'open_charge_map'
      limit:
        description: 'Maximum records to fetch'
        required: true
        default: '50'
      scope:
        description: 'Geographic scope'
        required: true
        default: 'mumbai'
      dry_run:
        description: 'Dry run (no database writes)'
        required: true
        type: boolean
        default: true

jobs:
  pipeline:
    name: Run Ingestion, Warehouse ETL & Quality Pipeline
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULED_INGESTION_ENABLED == 'true'
    environment: staging-ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ALLOW_STAGING_WRITES: ${{ vars.ALLOW_STAGING_WRITES || 'false' }}
      SCHEDULED_INGESTION_DRY_RUN: ${{ vars.SCHEDULED_INGESTION_DRY_RUN || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestion Run
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          OPENCHARGEMAP_API_KEY: ${{ secrets.STAGING_OPENCHARGEMAP_API_KEY }}
        run: |
          EXTRA_ARGS=""
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN="$SCHEDULED_INGESTION_DRY_RUN"
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$ALLOW_STAGING_WRITES" != "true" ]; then
            echo "Refusing non-dry-run ingestion: set ALLOW_STAGING_WRITES=true on the staging environment." >&2
            exit 2
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          SOURCE="${{ inputs.source || 'open_charge_map' }}"
          LIMIT="${{ inputs.limit || '50' }}"
          SCOPE="${{ inputs.scope || 'mumbai' }}"
          python -m backend.ingestion.runner --source "$SOURCE" --limit "$LIMIT" --scope "$SCOPE" --run-once $EXTRA_ARGS

      - name: Execute Warehouse ETL
        if: success()
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ETL_ARGS=""
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN="$SCHEDULED_INGESTION_DRY_RUN"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ETL_ARGS="--dry-run"
          fi
          python -m backend.warehouse.etl --job all $ETL_ARGS

      - name: Execute Warehouse Data Quality Checks
        if: success()
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          DQ_ARGS=""
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN="$SCHEDULED_INGESTION_DRY_RUN"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            DQ_ARGS="--dry-run"
          fi
          python -m backend.warehouse.quality $DQ_ARGS

      - name: Measure Warehouse Data Maturity
        if: success()
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          MATURITY_ARGS=""
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN="$SCHEDULED_INGESTION_DRY_RUN"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            MATURITY_ARGS="--dry-run"
          fi
          python -m backend.warehouse.maturity $MATURITY_ARGS

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "Pipeline failed; inspect the preceding sanitized stage logs and ingestion_runs records."
          echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
