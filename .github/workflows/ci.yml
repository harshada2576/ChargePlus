# ChargePlus CI (Phase 6.1): typecheck, lint, unit tests, production build.
# The build needs public Supabase vars at module-evaluation time, so CI
# supplies documented dummy values; runtime validation still fails fast
# on missing real configuration.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic python-dotenv requests psycopg2-binary pytest pytest-asyncio
      - run: python -m pytest tests/ -q --ignore=tests/test_canonical_postgres_integration.py
